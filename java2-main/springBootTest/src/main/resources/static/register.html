<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>注册 - 云购商城</title>
<style>
:root{
  --primary:#ff5a3c; --primary-dark:#e8431f; --bg:#f6f7f9; --card:#ffffff;
  --text:#1f2430; --muted:#8a90a0; --line:#ececf0;
  --shadow:0 6px 24px rgba(20,20,40,.08); --radius:16px;
  --ok:#1ec98b; --warn:#ff9f1a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fff1ed 0%,#f6f7f9 45%,#eef2ff 100%);
  color:var(--text);padding:20px;line-height:1.5;
}
/* 背景装饰气泡 */
.bubble{position:fixed;border-radius:50%;filter:blur(2px);opacity:.5;pointer-events:none;animation:float 9s ease-in-out infinite}
.b1{width:180px;height:180px;background:radial-gradient(circle,#ffd9cf,#ffb8a5);top:-50px;left:-40px}
.b2{width:240px;height:240px;background:radial-gradient(circle,#dbe4ff,#c7d4ff);bottom:-80px;right:-60px;animation-delay:-4s}
.b3{width:90px;height:90px;background:radial-gradient(circle,#fff3d6,#ffe0a3);top:16%;right:12%;animation-delay:-2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}

.card{
  position:relative;z-index:1;display:grid;grid-template-columns:1fr 300px;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;width:100%;max-width:860px;
  animation:pop .45s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* ---- 左侧表单 ---- */
.form-side{padding:38px 42px}
.brand{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;margin-bottom:4px}
.brand .logo{color:var(--primary)}
.brand span{color:var(--text)}
h1{font-size:22px;margin:14px 0 4px}
.sub{font-size:13px;color:var(--muted);margin-bottom:22px}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input{
  width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;
  font-size:14px;color:var(--text);outline:none;transition:border-color .15s, box-shadow .15s;background:#fafafb;
}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,90,60,.12);background:#fff}
.field.err input{border-color:var(--primary)}
.tip{font-size:12px;color:var(--primary);margin-top:5px;min-height:0}
.tip.ok{color:var(--ok)}
.tip:empty{display:none}

.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:44px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:16px;padding:6px;cursor:pointer;opacity:.6}
.eye:hover{opacity:1}

.strength{display:flex;align-items:center;gap:8px;margin-top:7px}
.captcha-row{display:flex;gap:8px;align-items:center}
.captcha-row input{flex:1;min-width:0;letter-spacing:1px;text-transform:none}
#cv{border:1.5px solid var(--line);border-radius:10px;background:#fafafb;cursor:pointer;flex-shrink:0}
#cv:hover{border-color:var(--primary)}
.refresh{border:1.5px solid var(--line);border-radius:10px;background:#fafafb;width:42px;height:42px;font-size:16px;cursor:pointer;flex-shrink:0;transition:.15s}
.refresh:hover{border-color:var(--primary);transform:rotate(90deg)}
.strength .bar{display:flex;gap:4px;flex:1}
.seg{height:4px;flex:1;border-radius:4px;background:var(--line);transition:background .25s}
.seg.on.s1{background:var(--primary)}
.seg.on.s2{background:var(--warn)}
.seg.on.s3{background:var(--ok)}
.strength em{font-size:12px;font-style:normal;font-weight:700;width:16px;text-align:center}
em.lv1{color:var(--primary)}em.lv2{color:var(--warn)}em.lv3{color:var(--ok)}

.agree{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--muted);margin:16px 0 4px;cursor:pointer;user-select:none}
.agree input{width:16px;height:16px;margin-top:2px;accent-color:var(--primary);flex-shrink:0}
.agree a{color:var(--primary)}

.btn{
  width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),#ff8a5c);color:#fff;
  font-size:16px;font-weight:700;cursor:pointer;transition:.2s;
  box-shadow:0 6px 16px rgba(255,90,60,.32);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(255,90,60,.4)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.65;cursor:not-allowed;transform:none}

.to-login{text-align:center;margin-top:16px;font-size:13px;color:var(--muted)}
.to-login a{color:var(--primary);cursor:pointer;font-weight:600}

/* ---- 右侧宣传栏 ---- */
.side{
  background:linear-gradient(160deg,#ff5a3c 0%,#ff8a5c 100%);
  color:#fff;padding:42px 30px;display:flex;flex-direction:column;justify-content:center;gap:6px;
}
.side .emoji{font-size:54px;margin-bottom:8px;animation:float 6s ease-in-out infinite}
.side h3{font-size:20px;margin-bottom:14px}
.side ul{list-style:none;display:flex;flex-direction:column;gap:12px;font-size:14px;opacity:.95}
.side .badge-new{
  align-self:flex-start;margin-top:22px;background:rgba(255,255,255,.2);
  padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;
}

/* 成功状态 */
.done{display:none;text-align:center;padding:30px 0}
.done .big{font-size:56px}
.done h2{margin:12px 0 6px;font-size:20px}
.done p{font-size:13px;color:var(--muted)}
.card.success .done{display:block}
.card.success form,.card.success h1,.card.success .sub{display:none}

@media(max-width:820px){
  .card{grid-template-columns:1fr;max-width:440px}
  .side{order:-1;padding:24px 26px}
  .side ul{flex-direction:row;flex-wrap:wrap;gap:8px 16px}
  .side .emoji{font-size:38px}
  .side .badge-new{margin-top:8px}
  .form-side{padding:26px 26px 30px}
}
</style>
</head>
<body>

<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>

<div class="card" id="card">
  <div class="form-side">
    <a class="brand" href="index.html" style="text-decoration:none"><span class="logo">云购</span><span>商城</span></a>

    <h1>创建新账号</h1>
    <p class="sub">注册即享新人专属礼包 🎁</p>

    <form id="form" novalidate>
      <div class="field" id="f-nick">
        <label>昵称</label>
        <input id="nick" maxlength="12" placeholder="登录账号（最多 12 字）" />
        <p class="tip" id="t-nick"></p>
      </div>

      <div class="field" id="f-pwd">
        <label>密码</label>
        <div class="pwd-wrap">
          <input id="pwd" type="password" placeholder="至少 6 位，建议字母 + 数字" autocomplete="new-password" />
          <button type="button" class="eye" id="eye" title="显示/隐藏密码">👁️</button>
        </div>
        <div class="strength" id="strength" style="display:none">
          <div class="bar">
            <span class="seg" id="s1"></span><span class="seg" id="s2"></span><span class="seg" id="s3"></span>
          </div>
          <em id="lv"></em>
        </div>
        <p class="tip" id="t-pwd"></p>
      </div>

      <div class="field" id="f-pwd2">
        <label>确认密码</label>
        <input id="pwd2" type="password" placeholder="再次输入密码" autocomplete="new-password" />
        <p class="tip" id="t-pwd2"></p>
      </div>

      <div class="field" id="f-captcha">
        <label>图形验证码</label>
        <div class="captcha-row">
          <input id="captcha" maxlength="4" placeholder="输入右侧 4 位字符" autocomplete="off" spellcheck="false" />
          <canvas id="cv" width="108" height="42" title="看不清？点击刷新"></canvas>
          <button type="button" class="refresh" id="refresh" title="换一张">🔄</button>
        </div>
        <p class="tip" id="t-captcha"></p>
      </div>

      <label class="agree" id="f-agree">
        <input type="checkbox" id="agree" />
        <span>我已阅读并同意 <a>《用户协议》</a> 和 <a>《隐私政策》</a></span>
      </label>
      <p class="tip" id="t-agree"></p>

      <button class="btn" type="submit" id="btn">立即注册</button>
    </form>

    <div class="done">
      <div class="big">🎉</div>
      <h2>注册成功！</h2>
      <p id="done-mail"></p>
    </div>

    <p class="to-login">已有账号？<a href="index.html#login">去登录</a></p>
  </div>

  <div class="side">
    <div class="emoji">🛍️</div>
    <h3>加入云购</h3>
    <ul>
      <li>✨ 千款好物，每日上新</li>
      <li>🚚 满 ¥99 包邮，闪电发货</li>
      <li>🎫 新人专享优惠券礼包</li>
      <li>🔄 七天无理由退换货</li>
    </ul>
    <span class="badge-new">新用户首单立减 ¥10</span>
  </div>
</div>

<script>
var $ = function (id) { return document.getElementById(id) }

/* ---------- 图形验证码 ---------- */
// 去掉易混淆字符 0/O、1/l/I
var CAPTCHA_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'
var captchaCode = ''

function genCaptcha() {
  var cv = $('cv'), ctx = cv.getContext('2d')
  var W = cv.width, H = cv.height
  captchaCode = ''
  for (var i = 0; i < 4; i++) {
    captchaCode += CAPTCHA_CHARS[Math.floor(Math.random() * CAPTCHA_CHARS.length)]
  }

  // 背景
  ctx.clearRect(0, 0, W, H)
  ctx.fillStyle = '#fafafb'
  ctx.fillRect(0, 0, W, H)

  // 干扰线
  for (var l = 0; l < 4; l++) {
    ctx.strokeStyle = 'hsl(' + Math.random() * 360 + ',60%,70%)'
    ctx.lineWidth = 1 + Math.random()
    ctx.beginPath()
    ctx.moveTo(Math.random() * W, Math.random() * H)
    ctx.bezierCurveTo(Math.random() * W, Math.random() * H, Math.random() * W, Math.random() * H, Math.random() * W, Math.random() * H)
    ctx.stroke()
  }

  // 逐字符绘制：随机旋转 + 偏移 + 颜色
  for (var i = 0; i < 4; i++) {
    var ch = captchaCode[i]
    ctx.save()
    ctx.font = 'bold 22px -apple-system,"Segoe UI","PingFang SC",Arial,sans-serif'
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.fillStyle = 'hsl(' + Math.floor(Math.random() * 360) + ',65%,40%)'
    var x = 15 + i * 26 + (Math.random() * 8 - 4)
    var y = H / 2 + (Math.random() * 6 - 3)
    ctx.translate(x, y)
    ctx.rotate((Math.random() * 44 - 22) * Math.PI / 180)
    ctx.fillText(ch, 0, 0)
    ctx.restore()
  }

  // 噪点
  for (var d = 0; d < 26; d++) {
    ctx.fillStyle = 'rgba(' + Math.floor(Math.random() * 200) + ',' + Math.floor(Math.random() * 200) + ',' + Math.floor(Math.random() * 200) + ',.5)'
    ctx.fillRect(Math.random() * W, Math.random() * H, 2, 2)
  }

  $('captcha').value = ''
}
function checkCaptcha() {
  var v = $('captcha').value.trim()
  if (!v) return setTip('f-captcha', 't-captcha', '请输入图形验证码'), false
  if (v.toUpperCase() !== captchaCode) {
    setTip('f-captcha', 't-captcha', '验证码不正确，请重试')
    genCaptcha() // 错误后自动换一张
    return false
  }
  return setTip('f-captcha', 't-captcha', '验证通过 ✓', true), true
}

$('cv').addEventListener('click', genCaptcha)   // 点图片刷新
$('refresh').addEventListener('click', genCaptcha)
$('captcha').addEventListener('input', function () { setTip('f-captcha', 't-captcha', '') })
$('captcha').addEventListener('blur', function () { if (this.value.trim()) checkCaptcha() })
genCaptcha()

function setTip(field, tip, msg, ok) {
  $(field).classList.toggle('err', !!msg && !ok)
  $(tip).textContent = msg || ''
  $(tip).classList.toggle('ok', !!ok)
}

// 实时输入：清除错误提示 + 密码强度
$('nick').addEventListener('input', function () { setTip('f-nick', 't-nick', '') })
$('pwd2').addEventListener('input', function () {
  if ($('pwd').value && $('pwd2').value === $('pwd').value) setTip('f-pwd2', 't-pwd2', '两次输入一致 ✓', true)
  else setTip('f-pwd2', 't-pwd2', '')
})
$('agree').addEventListener('change', function () { setTip('f-agree', 't-agree', '') })

$('pwd').addEventListener('input', function () {
  setTip('f-pwd', 't-pwd', '')
  var p = this.value
  $('strength').style.display = p ? 'flex' : 'none'
  var score = 0
  if (p.length >= 6) score++
  if (/[a-zA-Z]/.test(p) && /\d/.test(p)) score++
  if (p.length >= 10 || /[^a-zA-Z0-9]/.test(p)) score++
  var lv = Math.max(1, score)
  for (var i = 1; i <= 3; i++) {
    var seg = $('s' + i)
    seg.className = 'seg' + (i <= lv ? ' on s' + lv : '')
  }
  $('lv').textContent = p ? ['弱', '弱', '中', '强'][lv] : ''
  $('lv').className = 'lv' + lv
})

$('eye').addEventListener('click', function () {
  var inp = $('pwd')
  var show = inp.type === 'password'
  inp.type = show ? 'text' : 'password'
  this.textContent = show ? '🙈' : '👁️'
})

function checkNick() {
  var v = $('nick').value.trim()
  if (!v) return setTip('f-nick', 't-nick', '请输入昵称'), false
  if (v.length < 2) return setTip('f-nick', 't-nick', '昵称至少 2 个字符'), false
  if (v.indexOf('@') > -1) return setTip('f-nick', 't-nick', '昵称不能包含 @ 符号'), false
  return setTip('f-nick', 't-nick', ''), true
}
function checkPwd() {
  var v = $('pwd').value
  if (!v) return setTip('f-pwd', 't-pwd', '请输入密码'), false
  if (v.length < 6) return setTip('f-pwd', 't-pwd', '密码至少 6 位'), false
  return setTip('f-pwd', 't-pwd', ''), true
}
function checkPwd2() {
  if (!$('pwd2').value) return setTip('f-pwd2', 't-pwd2', '请再次输入密码'), false
  if ($('pwd2').value !== $('pwd').value) return setTip('f-pwd2', 't-pwd2', '两次输入的密码不一致'), false
  return setTip('f-pwd2', 't-pwd2', '两次输入一致 ✓', true), true
}

;['nick', 'pwd', 'pwd2'].forEach(function (id) {
  $(id).addEventListener('blur', function () {
    if (id === 'nick') checkNick()
    if (id === 'pwd') checkPwd()
    if (id === 'pwd2') checkPwd2()
  })
})

$('form').addEventListener('submit', function (e) {
  e.preventDefault()
  var ok = [checkNick(), checkPwd(), checkPwd2(), checkCaptcha()].every(Boolean)
  if (!$('agree').checked) { setTip('f-agree', 't-agree', '请先勾选同意用户协议'); ok = false }
  if (!ok) return

  var btn = $('btn')
  btn.disabled = true
  btn.textContent = '注册中…'

  var nick = $('nick').value.trim()
  // 调用 Spring Boot 后端注册接口（账号 = 昵称；后端按邮箱存储，用昵称生成本地邮箱标识）
  fetch('http://localhost:8081/api/user/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email: nick.replace(/\s+/g, '') + '@shop.local',
      nick: nick,
      pwd: $('pwd').value
    })
  })
  .then(function (r) { return r.json() })
  .then(function (res) {
    if (res.code === 200) {
      // 注册成功：不自动登录——写入商城本地账号表后跳转到登录页，需填对账号密码才能登录
      try {
        // 商城登录以本表校验，只有填对注册时的昵称 + 密码才能登录成功
        var users = JSON.parse(localStorage.getItem('shopUsers') || '[]')
        if (!users.some(function (u) { return u.nick === nick })) {
          users.push({ nick: nick, pwd: $('pwd').value })
        }
        localStorage.setItem('shopUsers', JSON.stringify(users))
        // 记住昵称，供登录页预填（用后即清空）
        localStorage.setItem('shopPrefillName', nick)
      } catch (err) { /* ignore */ }
      $('done-mail').textContent = '账号 ' + nick + ' 已创建，即将前往登录…'
      $('card').classList.add('success')
      setTimeout(function () { window.location.replace('index.html#login') }, 1500)
    } else {
      // 后端校验失败：昵称已注册 / 格式错误等
      genCaptcha()
      btn.disabled = false
      btn.textContent = '立即注册'
      if (res.msg.indexOf('昵称') > -1) setTip('f-nick', 't-nick', res.msg)
      else if (res.msg.indexOf('密码') > -1) setTip('f-pwd', 't-pwd', res.msg)
      else alert(res.msg)
    }
  })
  .catch(function () {
    // 后端未启动等网络错误
    genCaptcha()
    btn.disabled = false
    btn.textContent = '立即注册'
    alert('无法连接服务器，请先启动后端（springBootTest，端口 8081）')
  })
})
</script>
</body>
</html>
