server.port=8081

# ---------- MySQL 数据源 ----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ---------- MyBatis-Plus ----------
# 控制台打印 SQL（学习/调试用，上线可关闭）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto

# ---------- 后台管理系统管理员账号 ----------
# 后台账号已改为直接使用 user 表：permission = 0 为管理员，1 为默认权限（禁止进后台）。
# 内置管理员：昵称 admin / 邮箱 admin@shop.local / 明文密码 admin123（见 sql/shop_db.sql）。
# 如需改账号密码，直接 UPDATE user 表即可，不再从配置文件读取。

# ---------- 表结构初始化 ----------
# 启动时自动建商品表、幂等升级 user 表（新增 permission 字段、还原旧 MD5 密码为明文），
# 并导入商品种子数据。重复启动不会报错或插入重复数据。
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
